<!doctype html><html><head><meta charset="utf-8"><title>NotebookAid</title><link rel="stylesheet" href="vendor/quill.css"><link rel="stylesheet" href="notes.css"></head><body>
<header><img src="icons/notebookaid-32.png" alt=""><strong>NotebookAid</strong><span id="library-name"></span><span id="connection" role="status"></span><button id="reconnect" data-icon="RefreshCw" data-text="reconnect"></button><button id="start" data-icon="Power" data-text="start"></button><button id="open" data-icon="ExternalLink" data-text="open"></button></header>
<main><aside><div class="filters"><label><span data-text="search"></span><input id="search" type="search" maxlength="300"></label><label><span data-text="folder"></span><select id="folders"></select></label><label><span data-text="tag"></span><select id="tags"></select></label></div><div class="list-heading"><strong data-text="notes"></strong><span id="count"></span></div><div id="notes"></div><div class="paging"><button id="previous" data-icon="ChevronLeft" data-text="previous"></button><button id="next" data-icon="ChevronRight" data-text="next"></button></div><details><summary data-text="mapping"></summary><p data-text="mappingHint"></p><button id="sync-tags" data-icon="Tag" data-text="sync"></button><p id="mapping-result" role="status"></p></details></aside>
<section class="note-pane"><div id="error" role="alert"></div><div id="empty" data-text="empty"></div><article id="preview" hidden><div class="note-heading"><h1 id="title"></h1><button id="edit" data-icon="ExternalLink" data-text="edit"></button><button id="trash" data-icon="Trash2" data-text="trash"></button></div><div id="content"></div><p class="muted" data-text="previewHint"></p></article></section></main>
<dialog id="confirm"><h2 data-text="trash"></h2><p data-text="confirmTrash"></p><div class="dialog-actions"><button id="cancel-trash" data-icon="X" data-text="cancel"></button><button id="confirm-trash" class="primary" data-icon="Check" data-text="trash"></button></div></dialog>
<script src="icons.js"></script><script src="labels.js"></script><script src="vendor/marked.js"></script><script src="vendor/purify.js"></script><script src="vendor/quill.js"></script><script src="notes.js"></script></body></html>
