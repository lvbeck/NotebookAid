<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>NotebookAid T02</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>NotebookAid <small>T02</small></h1><p>Native Messaging 生命周期验证</p>
<button id="start"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>启动独立后台</button><button id="status"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>查询后台状态</button><button id="open"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4"/><path d="M2 8h20"/><path d="M6 4v4"/></svg>打开桌面窗口</button>
<pre id="result" role="status">请先注册测试桥接，再点击启动。</pre>
<p class="hint">记下 PID，关闭此面板或 Thunderbird 后，再打开并查询。后台 PID 应保持不变。完整笔记入口在 T10 实现。</p>
<script src="popup.js"></script></body></html>
